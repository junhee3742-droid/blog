<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>댓글 관리 | Vibe Lab Notes</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --paper: #f6f7f4; --surface: #fff; --ink: #1a2533; --muted: #5a6573;
        --rule: #dde2e0; --accent: #1f4f8a; --danger: #b3261e; color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #121a24; --surface: #18222e; --ink: #e2e7ec; --muted: #97a3b0;
          --rule: #27323f; --accent: #8fb4e6; --danger: #f2a39c; color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--paper); color: var(--ink); line-height: 1.6;
        font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        word-break: keep-all; overflow-wrap: break-word;
      }
      main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { font-size: 1.5rem; margin: 0 0 4px; }
      .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }
      form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
      input { flex: 1 1 220px; font: inherit; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
      button { font: inherit; padding: 9px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--paper); cursor: pointer; }
      button.del { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 4px 12px; font-size: 0.85rem; }
      #status { color: var(--muted); }
      ul { list-style: none; padding: 0; margin: 0; }
      li { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
      .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 0.9rem; }
      .head a { color: var(--accent); }
      .meta { color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; }
      .body { margin: 8px 0 10px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>댓글 관리</h1>
      <p class="sub">최근 댓글을 보고, 스팸이나 지우고 싶은 댓글을 삭제해요. <a href="/admin/">← 글 관리로</a></p>

      <form id="login">
        <input id="pw" type="password" placeholder="관리자 비밀번호 (Cloudflare의 ADMIN_PASSWORD)" autocomplete="current-password" required />
        <button type="submit">불러오기</button>
      </form>
      <p id="status"></p>
      <ul id="list"></ul>
    </main>

    <script>
      const KEY = 'vln-admin-pw';
      const $ = (id) => document.getElementById(id);
      let pw = '';
      try { pw = sessionStorage.getItem(KEY) || ''; } catch {}

      function fmt(iso) {
        const d = new Date(iso);
        return isNaN(d) ? iso : d.toLocaleString('ko-KR');
      }

      async function api(path, options = {}) {
        const res = await fetch(path, { ...options, headers: { authorization: 'Bearer ' + pw } });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || String(res.status));
        return data;
      }

      function render(comments) {
        const list = $('list');
        list.textContent = '';
        $('status').textContent = comments.length ? `댓글 ${comments.length}개` : '아직 댓글이 없어요.';
        for (const c of comments) {
          const li = document.createElement('li');
          const head = document.createElement('div');
          head.className = 'head';
          const name = document.createElement('strong');
          name.textContent = c.name;
          const link = document.createElement('a');
          link.href = '/' + c.post.split('/')[0] + '/posts/' + c.post.split('/').slice(1).join('/') + '/#comments';
          link.textContent = c.post;
          link.target = '_blank';
          const meta = document.createElement('span');
          meta.className = 'meta';
          meta.textContent = fmt(c.created_at) + ' · #' + c.id;
          head.append(name, link, meta);
          const body = document.createElement('p');
          body.className = 'body';
          body.textContent = c.body;
          const del = document.createElement('button');
          del.className = 'del';
          del.type = 'button';
          del.textContent = '삭제';
          del.addEventListener('click', async () => {
            if (!confirm('이 댓글을 삭제할까요? 되돌릴 수 없어요.')) return;
            try {
              await api('/api/admin/comments/' + c.id, { method: 'DELETE' });
              li.remove();
            } catch (e) {
              $('status').textContent = '삭제하지 못했어요: ' + e.message;
            }
          });
          li.append(head, body, del);
          list.append(li);
        }
      }

      async function load() {
        $('status').textContent = '불러오는 중…';
        try {
          const data = await api('/api/admin/comments');
          try { sessionStorage.setItem(KEY, pw); } catch {}
          render(data.comments);
        } catch (e) {
          const m = e.message;
          $('status').textContent =
            m === 'unauthorized' ? '비밀번호가 맞지 않아요.' :
            m === 'admin_disabled' ? 'Cloudflare에 ADMIN_PASSWORD가 아직 설정되지 않았어요.' :
            '불러오지 못했어요: ' + m;
        }
      }

      $('login').addEventListener('submit', (e) => {
        e.preventDefault();
        pw = $('pw').value;
        load();
      });
      if (pw) load();
    </script>
  </body>
</html>
