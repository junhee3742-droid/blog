<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>방문자 통계 | Vibe Lab Notes</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --paper: #f6f7f4; --surface: #fff; --ink: #1a2533; --muted: #5a6573;
        --rule: #dde2e0; --accent: #1f4f8a; --bar: #cddbee; color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #121a24; --surface: #18222e; --ink: #e2e7ec; --muted: #97a3b0;
          --rule: #27323f; --accent: #8fb4e6; --bar: #2c4566; color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--paper); color: var(--ink); line-height: 1.6;
        font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        word-break: keep-all; overflow-wrap: break-word;
      }
      main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { font-size: 1.5rem; margin: 0 0 4px; }
      h2 { font-size: 1.1rem; margin: 32px 0 12px; }
      .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }
      .sub a { color: var(--accent); }
      form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
      input { flex: 1 1 220px; font: inherit; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
      button { font: inherit; padding: 9px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--paper); cursor: pointer; }
      #status { color: var(--muted); }
      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
      .tile { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; }
      .tile .label { color: var(--muted); font-size: 0.85rem; }
      .tile .num { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
      .tile .note { color: var(--muted); font-size: 0.8rem; }
      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
      th, td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
      th:first-child, td:first-child { text-align: left; }
      td.barcell { width: 50%; padding-left: 12px; }
      .bar { height: 10px; background: var(--bar); border-radius: 3px; }
      th { color: var(--muted); font-weight: 500; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>방문자 통계</h1>
      <p class="sub">
        날짜는 한국 시간 기준이에요. 같은 사람이 하루에 여러 번 와도 방문자는 1명으로 세요.
        <a href="/admin/">← 글 관리로</a> · <a href="/admin/comments.html">댓글 관리</a>
      </p>

      <form id="login">
        <input id="pw" type="password" placeholder="관리자 비밀번호 (Cloudflare의 ADMIN_PASSWORD)" autocomplete="current-password" required />
        <button type="submit">불러오기</button>
      </form>
      <p id="status"></p>

      <section id="stats" hidden>
        <div class="tiles">
          <div class="tile"><div class="label">오늘 방문자</div><div class="num" id="todayVisitors">0</div><div class="note" id="todayViews"></div></div>
          <div class="tile"><div class="label">누적 방문자</div><div class="num" id="totalVisitors">0</div><div class="note" id="totalViews"></div></div>
        </div>
        <h2>최근 30일</h2>
        <table>
          <thead><tr><th>날짜</th><th>방문자</th><th>페이지뷰</th><th></th></tr></thead>
          <tbody id="daily"></tbody>
        </table>
      </section>
    </main>

    <script>
      const KEY = 'vln-admin-pw';
      const $ = (id) => document.getElementById(id);
      const n = (v) => Number(v || 0).toLocaleString('ko-KR');
      let pw = '';
      try { pw = sessionStorage.getItem(KEY) || ''; } catch {}

      function render(s) {
        $('todayVisitors').textContent = n(s.today_visitors);
        $('todayViews').textContent = '페이지뷰 ' + n(s.today_views);
        $('totalVisitors').textContent = n(s.total_visitors);
        $('totalViews').textContent = '페이지뷰 ' + n(s.total_views);

        const body = $('daily');
        body.textContent = '';
        const max = Math.max(1, ...s.daily.map((d) => d.visitors));
        for (const d of s.daily) {
          const tr = document.createElement('tr');
          const cells = [d.day + (d.day === s.today ? ' (오늘)' : ''), n(d.visitors), n(d.views)];
          for (const text of cells) {
            const td = document.createElement('td');
            td.textContent = text;
            tr.append(td);
          }
          const barTd = document.createElement('td');
          barTd.className = 'barcell';
          const bar = document.createElement('div');
          bar.className = 'bar';
          bar.style.width = (d.visitors / max) * 100 + '%';
          barTd.append(bar);
          tr.append(barTd);
          body.append(tr);
        }
        $('status').textContent = s.daily.length ? '' : '아직 기록된 방문이 없어요.';
        $('stats').hidden = false;
      }

      async function load() {
        $('status').textContent = '불러오는 중…';
        try {
          const res = await fetch('/api/admin/stats', { headers: { authorization: 'Bearer ' + pw } });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || String(res.status));
          try { sessionStorage.setItem(KEY, pw); } catch {}
          render(data);
        } catch (e) {
          const m = e.message;
          $('status').textContent =
            m === 'unauthorized' ? '비밀번호가 맞지 않아요.' :
            m === 'admin_disabled' ? 'Cloudflare에 ADMIN_PASSWORD가 아직 설정되지 않았어요.' :
            '불러오지 못했어요: ' + m;
        }
      }

      $('login').addEventListener('submit', (e) => {
        e.preventDefault();
        pw = $('pw').value;
        load();
      });
      if (pw) load();
    </script>
  </body>
</html>
